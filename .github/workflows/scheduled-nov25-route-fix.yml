name: Publish Nov 25 route fix

on:
  schedule:
    - cron: '0 7 25 11 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the route response race fix
        id: patch
        run: |
          if [[ "$(date -u +%F)" != "2026-11-25" ]]; then
            echo "This scheduled change is only valid on 2026-11-25 UTC."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          patch_file=".github/nov25-route-race.patch"
          if [[ ! -f "$patch_file" ]]; then
            echo "Scheduled change already applied."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git apply --ignore-space-change --check "$patch_file"
          git apply --ignore-space-change "$patch_file"
          git rm -- "$patch_file"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.patch.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Verify production build
        if: steps.patch.outputs.publish == 'true'
        run: |
          npm ci
          npm run build
      - name: Commit and push
        if: steps.patch.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.tsx
          git commit -m "Ignore stale walking route results"
          git push origin main
